# Données de ventes (DVF) pour l'estimation d'Arpent.
# Télécharge les « Demandes de valeurs foncières géolocalisées » (DGFiP / Etalab),
# les nettoie et publie des fichiers compacts dans arpent/dvf/ (servis par GitHub Pages).
# Se relance à chaque modification du script, ou à la main (onglet Actions › Run workflow).
name: Données DVF

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/dvf.yml"
      - "tools/build_dvf.py"

permissions:
  contents: write

concurrency:
  group: dvf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Construire les fichiers de ventes
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf arpent/dvf.new
          python tools/build_dvf.py --out arpent/dvf.new --workers 12 2>&1 | tee tools/last-build.log
      - name: Publier
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then rm -rf arpent/dvf && mv arpent/dvf.new arpent/dvf; else rm -rf arpent/dvf.new; fi
          git config user.name "arpent-bot"
          git config user.email "arpent-bot@users.noreply.github.com"
          git add -A arpent/dvf tools/last-build.log
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -q -m "Données DVF $(date -u +%Y-%m-%d) (${{ steps.build.outcome }})"
          git push origin HEAD:gh-pages
